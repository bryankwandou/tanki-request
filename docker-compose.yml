services:
  # Aplikasi Next.js (build produksi). Dipisah lewat profile `app` supaya
  # `docker compose up -d` untuk pengembangan tetap hanya menyalakan
  # infrastruktur, dan `npm run dev` di host tidak berebut port 3000.
  #
  #   docker compose --profile app up -d --build app
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tanki-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      # Nama service Docker, bukan 127.0.0.1 — di dalam container, localhost
      # menunjuk ke container itu sendiri.
      DATABASE_URL: "mysql://tanki:password@mysql:3306/tanki_jene?allowPublicKeyRetrieval=true"
      REDIS_URL: "redis://redis:6379"
      AUTH_URL: "${AUTH_URL:-http://localhost:3100}"
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET wajib diisi di .env}"
      CONFIG_ENCRYPTION_KEY: "${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY wajib diisi di .env}"
      TRACKING_LINK_SECRET: "${TRACKING_LINK_SECRET:-}"
      AUTH_KEYCLOAK_ISSUER: "${AUTH_KEYCLOAK_ISSUER:-}"
      AUTH_KEYCLOAK_ID: "${AUTH_KEYCLOAK_ID:-}"
      AUTH_KEYCLOAK_SECRET: "${AUTH_KEYCLOAK_SECRET:-}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3100}"
      TRUSTED_PROXY_COUNT: "${TRUSTED_PROXY_COUNT:-1}"
    ports:
      # 3100 di host: 3000 sudah dipakai `npm run dev` saat pengembangan.
      - "3100:3000"

  mysql:
    image: mysql:8
    container_name: tanki-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: tanki_jene
      MYSQL_USER: tanki
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - tanki_mysql_data:/var/lib/mysql

  # Mailpit — SMTP sink lokal untuk uji email. SMTP :1025, web UI :8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: tanki-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Redis — backend rate limiter atomik (Issue #5). Dimatikan/dinyalakan saat
  # uji degradasi ke in-memory, jadi sengaja tanpa `restart: unless-stopped`.
  redis:
    image: redis:7-alpine
    container_name: tanki-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Keycloak lokal untuk development (pengganti instance DIAMOND saat VPS down).
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: tanki-keycloak
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - tanki_keycloak_data:/opt/keycloak/data

volumes:
  tanki_mysql_data:
  tanki_keycloak_data:
